# 모델 라우팅 (§6).
# 설계안의 실측 구성은 오케스트레이터·옵티마이저 = Opus(4.6, 1M context), 대량 단계 = Sonnet, DART 1차 분류 = Haiku다.
# 같은 등급 구조를 현행 세대 모델로 대응한다. 실측 그대로 재현하려면 model 값을 claude-opus-4-6 등으로 바꾼다.
#
# effort: Fable 5.2 지시파일의 운용 권고 — High로 시작하고, 품질이 유지되면 Medium으로 낮춰 비용·속도를 최적화한다. Max는 쓰지 않는다.
# 현행 모델은 temperature·seed를 받지 않는다. 재현성은 llm.py의 프롬프트 전문 로깅 + 리플레이 캐시로 확보한다.
# fallbacks: 서버 측 거절 폴백(server-side-fallback). Haiku는 지원하지 않으므로 none.

defaults:
  max_tokens: 16000

routes:
  orchestrator:  {model: claude-opus-5-5,   effort: high, fallbacks: default}   # Stage 5 스왑 근거 작성
  screening:     {model: claude-sonnet-5-5, effort: high, fallbacks: default}   # Stage 1 (종목당 1회)
  adversarial:   {model: claude-sonnet-5-5, effort: high, fallbacks: default}   # Stage 2 (불 15 + 베어 15)
  scenario:      {model: claude-sonnet-5-5, effort: high, fallbacks: default}   # Stage 3 (종목당 1개)
  optimizer:     {model: claude-opus-5-5,   effort: high, fallbacks: default}   # Stage 4 "Agent of agents"
  thesis_review: {model: claude-sonnet-5-5, effort: high, fallbacks: default}   # §7-2 thesis 재평가
  macro:         {model: claude-opus-5-5,   effort: high, fallbacks: default}   # 월 1회 매크로 예측
  dart_triage:   {model: claude-haiku-5-5,  effort: high, fallbacks: none}      # DART 1차 분류
  dart_deep:     {model: claude-opus-5-5,   effort: high, fallbacks: default}   # DART high 재분석
  sentiment:     {model: claude-haiku-5-5,  effort: high, fallbacks: none}      # 감성 레이더

# Stage 2 에이전트의 독립 웹검색 (서버 측 web_search 도구).
web_search:
  enabled: true
  max_uses: 4
  allowed_domains:
    - news.naver.com
    - n.news.naver.com
    - finance.naver.com
    - dart.fss.or.kr
    - kind.krx.co.kr
    - yna.co.kr
    - hankyung.com
    - mk.co.kr
    - edaily.co.kr
    - sedaily.com
    - mt.co.kr
    - thebell.co.kr
