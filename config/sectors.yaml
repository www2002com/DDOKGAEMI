# 섹터 분류 (§3.3 "섹터 비중 ≤ 35% (GICS 11개 섹터)").
# 한국 공개 데이터에는 GICS가 없다. KRX 업종명 또는 FDR KRX-DESC의 표준산업분류(KSIC) 업종명을
# 키워드 순서대로 대조해 GICS 11개 섹터로 근사한다. 먼저 맞는 규칙이 이긴다.
# 대표 종목은 overrides로 확정한다. 어디에도 맞지 않으면 "미분류"이며, 미분류도 하나의 섹터로 35% 상한을 받는다.

sectors:
  - 에너지
  - 소재
  - 산업재
  - 경기소비재
  - 필수소비재
  - 헬스케어
  - 금융
  - 정보기술
  - 커뮤니케이션서비스
  - 유틸리티
  - 부동산

keyword_rules:
  # 정보기술 — "통신 및 방송 장비"는 커뮤니케이션의 "통신"보다 먼저 검사해야 한다.
  # "특수 목적용 기계"(KSIC)는 유니버스에서 대부분 반도체·디스플레이 장비 업체다 → 정보기술. 로봇·건설기계는 overrides.
  # "측정, 시험 … 정밀기기"도 반도체 계측·검사 장비가 대부분이다.
  - {sector: 정보기술, keywords: ["특수 목적용 기계", "측정, 시험", "반도체", "전자부품", "통신 및 방송 장비", "컴퓨터 및 주변", "디스플레이", "인쇄회로",
                                 "소프트웨어 개발", "시스템 소프트웨어", "응용 소프트웨어", "컴퓨터 프로그래밍", "컴퓨터시스템",
                                 "IT S/W", "IT H/W", "IT부품", "통신장비", "전기전자", "전기·전자", "일반전기전자", "정보서비스"]}
  - {sector: 산업재, keywords: ["일차전지 및 이차전지", "전동기", "발전기", "전기 변환", "절연선", "전기장비"]}
  # "자연과학 및 공학 연구개발업"은 유니버스에서 대부분 신약 개발사다.
  - {sector: 헬스케어, keywords: ["의약", "의료", "생물학적", "바이오", "제약", "의료정밀", "의료·정밀", "연구개발"]}
  - {sector: 커뮤니케이션서비스, keywords: ["자료처리, 호스팅, 포털", "포털", "인터넷", "방송", "영화", "오디오물", "출판",
                                         "광고", "게임", "디지털컨텐츠", "오락·문화", "전기 통신", "통신업", "통신서비스", "통신"]}
  - {sector: 금융, keywords: ["은행", "보험", "증권", "신탁", "금융", "투자업", "여신"]}
  - {sector: 경기소비재, keywords: ["자동차", "타이어", "의복", "섬유", "신발", "가구", "가전", "가정용 기기", "숙박", "음식점", "여행",
                                  "카지노", "교육", "유통", "소매", "섬유의복", "섬유·의류"]}
  - {sector: 에너지, keywords: ["석유", "원유", "정제", "코크스", "천연가스 채굴"]}
  - {sector: 유틸리티, keywords: ["발전업", "송전", "전기업", "연료용 가스", "증기", "수도", "전기가스", "전기·가스"]}
  - {sector: 필수소비재, keywords: ["식료품", "식품", "음료", "담배", "음식료", "농업", "어업", "축산", "도축", "제분", "설탕", "수산",
                                  "화장품", "생활용품"]}
  - {sector: 부동산, keywords: ["부동산", "리츠"]}
  - {sector: 소재, keywords: ["화학", "철강", "금속", "비금속", "시멘트", "종이", "펄프", "플라스틱", "고무", "광업", "목재", "유리"]}
  - {sector: 산업재, keywords: ["선박", "조선", "항공기", "철도", "건설", "토목", "기계", "엔진", "운송", "운수", "해운", "물류",
                                "창고", "무기", "총포", "도매", "중개", "경비", "서비스업", "일반서비스", "운송장비"]}

