[project]
name = "autopilot-korea"
version = "0.1.0"
description = "한국형 투자 에이전트 — Claude Portfolio 5단계 오케스트레이션의 KOSPI200+KOSDAQ150 구현 (설계안 v1.3)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.8",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "requests>=2.31",
    "pandas>=2.0",
    "numpy>=1.26",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# 데이터 레이어(§4): pykrx는 KRX 로그인(KRX_ID/KRX_PW)이 필요하다. FinanceDataReader는 로그인 없는 대체 원천이다.
data = ["pykrx>=1.2.9", "finance-datareader>=0.9", "beautifulsoup4>=4.12", "lxml>=5.0"]
# 스케줄러(§4.3, §13)
scheduler = ["celery[redis]>=5.3"]
# 운영 DB(§4.3)
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8"]

[project.scripts]
autopilot = "autopilot_korea.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autopilot_korea = ["agents/prompts/prompts_kr/*.md", "agents/prompts/prompts_kr/*.json", "collectors/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "live: 실제 외부 원천(FDR·FnGuide·네이버·ECOS 등)을 호출하는 테스트. AUTOPILOT_LIVE_TESTS=1일 때만 실행",
]
